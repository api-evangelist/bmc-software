name: BMC Software
description: 'BMC Software is an enterprise software company providing automation, service
  management, and mainframe solutions for large organizations. Its flagship products
  include Control-M for application and data workflow orchestration, the BMC AMI portfolio
  (Automated Mainframe Intelligence) for DevOps, operations, storage, security, and
  data protection, and BMC Helix for IT service and operations management. BMC exposes
  programmatic access primarily through the Control-M Automation API (a REST API with
  Jobs-as-Code), an official Python client (ctm-python-client), a command-line
  interface (ctm), and a VS Code extension, all maintained under the github.com/controlm
  organization. Approximately 80% of the Forbes Global 100 rely on BMC technology
  across financial services, healthcare, manufacturing, telecommunications, and the
  public sector.'
